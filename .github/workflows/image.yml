name: Build Multiplatform Images

on:
  push:
    branches:
      - main
      - pnpm-10.33
  workflow_dispatch:

permissions:
  contents: write

env:
  PNPM_VERSION: "10.33.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # node:alpine = floating latest (Node 25, Current) — arm/v6, arm/v7, ppc64le removed in Node 24+
          - node-tag: alpine
            image-tag: latest
            platforms: linux/amd64,linux/arm64/v8,linux/s390x
          # Node 24 — Active LTS
          - node-tag: 24-alpine
            image-tag: node24
            platforms: linux/amd64,linux/arm64/v8,linux/s390x
          # Node 22 — Maintenance LTS; still ships arm/v6, arm/v7
          - node-tag: 22-alpine
            image-tag: node22
            platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/s390x
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            NODE_VERSION=${{ matrix.node-tag }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
          tags: mitchpash/pnpm:${{ matrix.image-tag }}

  update-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Update supported targets in README
        run: |
          docker buildx imagetools inspect mitchpash/pnpm:latest --format '{{json .}}' > /tmp/inspect.json
          python3 << 'EOF'
          import json, re

          with open('/tmp/inspect.json') as f:
              data = json.load(f)

          manifests = data.get('manifest', {}).get('manifests', [])
          rows = []
          for m in manifests:
              p = m.get('platform', {})
              os_name = p.get('os', '')
              arch = p.get('architecture', '')
              variant = p.get('variant', '')
              if os_name in ('unknown', '') or arch in ('unknown', ''):
                  continue
              target = f'{os_name}/{arch}/{variant}' if variant else f'{os_name}/{arch}'
              rows.append(f'| {target} | ✅ |')

          table = '| Target | Supported |\n| - | - |\n' + '\n'.join(rows)

          with open('README.md', 'r') as f:
              content = f.read()

          new_content = re.sub(
              r'<!-- TARGETS-START -->.*?<!-- TARGETS-END -->',
              f'<!-- TARGETS-START -->\n{table}\n<!-- TARGETS-END -->',
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(new_content)

          print('README updated')
          EOF
      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update supported targets [skip ci]"
          git push
